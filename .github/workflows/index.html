<!DOCTYPE html>
<html>
<head>
    <title>International Scholarships</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #eef1f7; }
        .neo-card { 
            background: white; border: 3px solid #111318; border-radius: 14px;
            box-shadow: 4px 4px 0px #111318; transition: 0.2s;
        }
        .neo-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #111318; }
        .neo-btn {
            background: #2f6bff; color: white; font-weight: 900; border: 3px solid #111318;
            box-shadow: 3px 3px 0px #111318; padding: 10px 20px; border-radius: 10px;
        }
    </style>
</head>
<body class="p-4 md:p-10">
    <header class="max-w-5xl mx-auto mb-10 flex justify-between items-center">
        <h1 style="font-family: 'Outfit';" class="text-3xl font-black text-[#2f6bff]">GLOBAL SCHOLARSHIPS</h1>
        <div class="neo-btn">Daily Auto-Updates</div>
    </header>

    <div id="scholarships-list" class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Scholarships will appear here automatically! -->
    </div>

    <script>
        // This simple script connects your website to your Filing Cabinet
        async function loadScholarships() {
            const response = await fetch('YOUR_SUPABASE_URL/rest/v1/scholarships?select=*', {
                headers: { 'apikey': 'YOUR_SUPABASE_KEY', 'Authorization': 'Bearer YOUR_SUPABASE_KEY' }
            });
            const data = await response.json();
            const list = document.getElementById('scholarships-list');
            data.forEach(s => {
                list.innerHTML += `
                    <div class="neo-card p-6">
                        <span class="text-xs font-bold uppercase text-[#ff5a3c]">${s.level}</span>
                        <h2 class="text-xl font-black mt-2 mb-4">${s.title}</h2>
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-500">${s.country}</span>
                            <a href="${s.link}" target="_blank" class="neo-btn text-sm">View & Apply →</a>
                        </div>
                    </div>
                `;
            });
        }
        loadScholarships();
    </script>
</body>
</html>
